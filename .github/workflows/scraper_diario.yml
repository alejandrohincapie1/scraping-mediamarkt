name: Scraper diario MediaMarkt

on:
  schedule:
    - cron: '0 7 * * *'   # Todos los dias a las 07:00 UTC (09:00 en España en verano, 08:00 en invierno)
  workflow_dispatch:       # Permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write          # Para poder guardar el CSV en el repositorio

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python ScrappingMediaMarkt.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Precios $(date +%F)"
          git push
